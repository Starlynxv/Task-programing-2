<div style="padding: 20px; font-family: sans-serif; color: white;">
  <h2>⛺ Inventario de Equipos de Camping</h2>

  <div style="background-color: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
    <h3>Agregar Nuevo Equipo</h3>
    
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <div>
        <label>Nombre:</label><br>
        <input type="text" [(ngModel)]="nuevoEquipo.name" placeholder="Ej. Casa de campaña 4 personas" style="padding: 5px; background: #222; color: white; border: 1px solid #555;">
      </div>

      <div>
        <label>Estado:</label><br>
        <select [(ngModel)]="nuevoEquipo.equipmentStatus" style="padding: 5px; background: #222; color: white; border: 1px solid #555;">
          <option value="Disponible">Disponible</option>
          <option value="Prestado">Prestado</option>
          <option value="En Reparación">En Reparación</option>
        </select>
      </div>

      <div>
        <label>Precio / Día (RD$):</label><br>
        <input type="number" [(ngModel)]="nuevoEquipo.pricePerDay" style="padding: 5px; background: #222; color: white; border: 1px solid #555;">
      </div>

      <div>
        <label>Categoría:</label><br>
        <select [(ngModel)]="nuevoEquipo.categoryId" style="padding: 5px; background: #222; color: white; border: 1px solid #555;">
          <option [ngValue]="0" disabled>Selecciona una...</option>
          <option *ngFor="let cat of categorias" [ngValue]="cat.id">
            {{ cat.name }}
          </option>
        </select>
      </div>
      <div style="margin-top: 18px;">
        <button (click)="guardarEquipo()" style="background-color: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px;">
          ➕ Guardar Equipo
        </button>
      </div>
    </div>
  </div>

  <table border="1" style="width: 100%; text-align: left; border-collapse: collapse; background-color: #222; margin-top: 20px;">
    <thead style="background-color: #444;">
      <tr>
        <th style="padding: 10px;">ID</th>
        <th style="padding: 10px;">Nombre</th>
        <th style="padding: 10px;">Estado</th>
        <th style="padding: 10px;">Precio / Día</th>
        <th style="padding: 10px; text-align: center;">Acciones</th> 
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let equipo of equipos; let i = index">
        <td style="padding: 8px;">{{ i + 1 }}</td> 
        <td style="padding: 8px;">{{ equipo.name }}</td>
        <td style="padding: 8px;">{{ equipo.equipmentStatus }}</td>
        <td style="padding: 8px;">RD$ {{ equipo.pricePerDay }}</td>
        <td style="padding: 8px; text-align: center;">
          <button (click)="cargarDatosParaEditar(equipo)" style="background-color: #007bff; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; margin-right: 5px;">
            ✏️ Editar
          </button>
          <button (click)="eliminarEquipo(equipo.id)" style="background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px;">
            🗑️ Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  
  <p *ngIf="equipos.length === 0" style="color: #ff9900; margin-top: 15px;">
    No hay equipos registrados todavía.
  </p>
  
</div>
